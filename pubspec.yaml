name: atlas_flutter_app
description: Atlas - Gamified Self-Improvement
publish_to: 'none'
version: 2.0.0+15

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.1.0

  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^7.0.0
  signalr_netcore: ^1.3.7

  # Local Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0

  # Authentication
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.6
  flutter_secure_storage: ^11.0.0

  # Charts
  fl_chart: ^1.2.0

  # Environment
  flutter_dotenv: ^6.0.0

  # UI & Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

  # Notifications
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  package_info_plus: ^10.2.1
  equatable: ^2.0.0
  logger: ^2.5.0
  # OpenIAP. Replaces the in_app_purchase trio: Play Billing 9.1 (required for
  # new uploads from 2026-11-01) and StoreKit 2 on iOS, behind one API that
  # exposes subscription offers and pricing phases directly.
  flutter_inapp_purchase: ^10.6.1
  in_app_update: ^5.0.0
  in_app_review: ^2.0.10
  refresh_rate: ^1.0.2
  gpt_markdown: ^1.1.7
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  material_symbols_icons: ^4.2960.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.22.0
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.0+1
  flutter_lints: ^6.0.0
  # Branding asset generation
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/brand/
    - assets/legal/

  fonts:
    - family: FunnelDisplay
      fonts:
        - asset: assets/fonts/FunnelDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/FunnelDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/FunnelDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FunnelDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/FunnelDisplay-ExtraBold.ttf
          weight: 800
    - family: FunnelSans
      fonts:
        - asset: assets/fonts/FunnelSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/FunnelSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/FunnelSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/FunnelSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FunnelSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/FunnelSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/FunnelSans-ExtraBold.ttf
          weight: 800

# ─── App icon (Daylight spark on ink) ───
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/atlas_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "assets/brand/atlas_icon_bg.png"
  adaptive_icon_foreground: "assets/brand/atlas_icon_fg.png"
  adaptive_icon_foreground_inset: 0

# ─── Native splash ───
# After `dart run flutter_native_splash:create`, re-add the system-bar items
# (windowLightStatusBar etc.) to android/app/src/main/res/values*/styles.xml:
# the peach ground needs dark bar icons in dark mode too.
flutter_native_splash:
  color: "#FFE7D6"
  color_dark: "#FFE7D6"
  image: "assets/brand/splash_spark.png"
  image_dark: "assets/brand/splash_spark.png"
  android_12:
    color: "#FFE7D6"
    color_dark: "#FFE7D6"
    image: "assets/brand/splash_spark_android12.png"
    image_dark: "assets/brand/splash_spark_android12.png"
    icon_background_color: "#FFE7D6"
    icon_background_color_dark: "#FFE7D6"
  fullscreen: false
