name: atlas_flutter_app
description: Atlas - Gamified Self-Improvement
publish_to: 'none'
version: 1.3.0+13

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.1.0

  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^7.0.0
  signalr_netcore: ^1.3.7

  # Local Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0

  # Authentication
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.6
  flutter_secure_storage: ^11.0.0

  # Charts
  fl_chart: ^1.2.0

  # Environment
  flutter_dotenv: ^6.0.0

  # UI & Animations
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

  # Notifications
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^22.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  package_info_plus: ^10.2.1
  equatable: ^2.0.0
  logger: ^2.5.0
  in_app_purchase: ^3.3.0
  # Direct dep (not just transitive): the paywall reads Play's subscription
  # offer/pricing phases to show the real recurring price and the trial the
  # user is actually eligible for.
  in_app_purchase_android: ^0.5.2
  # Same reason on iOS: the paywall reads StoreKit2's introductory-offer
  # info to show the free trial and the real recurring price.
  in_app_purchase_storekit: ^0.4.11
  in_app_update: ^5.0.0
  in_app_review: ^2.0.10
  refresh_rate: ^1.0.2
  gpt_markdown: ^1.1.7
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.22.0
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.0+1
  flutter_lints: ^6.0.0
  # Test-only: lets the billing tests swap in a fake store platform.
  in_app_purchase_platform_interface: ^1.4.1
  # Branding asset generation
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/brand/
    - assets/legal/

# ─── App icon (Living World / Aurora mark) ───
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/atlas_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "assets/brand/atlas_icon_bg.png"
  adaptive_icon_foreground: "assets/brand/atlas_icon_fg.png"

# ─── Native splash ───
flutter_native_splash:
  color: "#0E1326"
  image: "assets/brand/atlas_splash.png"
  android_12:
    color: "#0E1326"
    image: "assets/brand/atlas_splash.png"
  fullscreen: false
