name: atlas_flutter_app
description: Atlas - Gamified Self-Improvement
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.1.0

  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^7.0.0
  signalr_netcore: ^1.3.7

  # Local Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Authentication
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.0.0

  # Charts
  fl_chart: ^0.70.2

  # Environment
  flutter_dotenv: ^6.0.0

  # UI & Animations
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

  # Notifications
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  equatable: ^2.0.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.22.0
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.0+1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
